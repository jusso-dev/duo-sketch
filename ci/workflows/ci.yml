# Waiting to be moved to .github/workflows/ci.yml (see issue #9).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-linux:
    name: SketchCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: Packages/SketchCore
        run: swift build
      - name: Test
        working-directory: Packages/SketchCore
        run: swift test

  app-macos:
    name: App (macOS, Xcode)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Core tests
        working-directory: Packages/SketchCore
        run: swift test
      - name: Generate project
        working-directory: App
        run: xcodegen generate
      - name: Build and test app
        working-directory: App
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["name"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "Using simulator: $DEVICE"
          xcodebuild -project DuoSketch.xcodeproj -scheme DuoSketch \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO build test
