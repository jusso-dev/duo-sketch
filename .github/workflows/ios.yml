name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing by default. Each job asks for only what it needs.
permissions: {}

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: SketchCore and app (xcode-27 hosted runner)
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List Xcodes, SDKs and simulators
        run: |
          sw_vers
          echo "== Xcode installs"
          ls /Applications | grep Xcode || true
          echo "== Default Xcode"
          xcode-select -p
          xcodebuild -version
          echo "== SDKs"
          xcodebuild -showsdks
          echo "== Simulators"
          xcrun simctl list devices available

      - name: Select Xcode with iOS 27.1+ SDK
        run: |
          has_duo_sdk() {
            "$1/Contents/Developer/usr/bin/xcodebuild" -showsdks 2>/dev/null \
              | sed -nE 's/.*-sdk iphoneos([0-9.]+).*/\1/p' \
              | while read -r v; do
                  if [ "$(printf '%s\n27.1\n' "$v" | sort -V | head -1)" = "27.1" ]; then echo "$v"; fi
                done | sort -V | tail -1
          }
          PICK=""
          for x in $(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V -r); do
            v=$(has_duo_sdk "$x")
            if [ -n "$v" ]; then PICK="$x"; echo "$x has iOS SDK $v"; break; fi
            echo "$x: no iOS 27.1+ SDK"
          done
          if [ -z "$PICK" ]; then
            echo "::error::No Xcode with an iOS 27.1+ SDK on this runner. DeviceHinge needs iOS 27.1, so the build would not test what it claims to."
            exit 1
          fi
          sudo xcode-select -s "$PICK/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios
          swift --version
          echo "== Device types"
          xcrun simctl list devicetypes
          echo "== Runtimes"
          xcrun simctl list runtimes

      - name: SketchCore tests
        working-directory: Packages/SketchCore
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: App
        run: xcodegen generate

      - name: Ensure an iOS 27.1+ simulator runtime
        timeout-minutes: 25
        run: |
          have_runtime() {
            xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rts = json.load(sys.stdin)["runtimes"]
          ok = [r for r in rts if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
                and [int(x) for x in r["version"].split(".")[:2]] >= [27, 1]]
          sys.exit(0 if ok else 1)'
          }
          if have_runtime; then
            echo "An iOS 27.1+ runtime is already installed."
          else
            echo "No iOS 27.1+ runtime. Downloading with xcodebuild -downloadPlatform iOS."
            if ! xcodebuild -downloadPlatform iOS; then
              echo "::error::xcodebuild -downloadPlatform iOS failed, so there is no iOS 27.1+ simulator runtime to test on."
              exit 1
            fi
            if ! have_runtime; then
              echo "::error::The download finished but no iOS 27.1+ simulator runtime is available."
              exit 1
            fi
            echo "Download finished."
          fi
          xcrun simctl list runtimes

      - name: Create a simulator
        id: sim
        run: |
          read -r RUNTIME DEVTYPE DEVNAME < <(python3 - <<'PY'
          import json, subprocess
          def j(*a):
              return json.loads(subprocess.check_output(["xcrun", "simctl", "list", "-j", *a]))
          rts = [r for r in j("runtimes")["runtimes"]
                 if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
                 and [int(x) for x in r["version"].split(".")[:2]] >= [27, 1]]
          if not rts:
              raise SystemExit("::error::No available iOS 27.1+ simulator runtime.")
          rts.sort(key=lambda r: [int(x) for x in r["version"].split(".")], reverse=True)
          alltypes = j("devicetypes")["devicetypes"]
          pick = None
          # Prefer an iPhone Duo on the newest runtime that supports it.
          for rt in rts:
              supported = rt.get("supportedDeviceTypes") or alltypes
              duo = [d for d in supported if "iPhone-Duo" in d["identifier"] or "Duo" in d["name"]]
              if duo:
                  pick = (rt, duo[-1])
                  break
          # If no runtime lists it as supported but the Duo device type exists, still try
          # it on the newest runtime. The create step falls back to a standard iPhone if it fails.
          if pick is None:
              duo = [d for d in alltypes if "iPhone-Duo" in d["identifier"]]
              if duo:
                  pick = (rts[0], duo[-1])
          # Otherwise the newest iPhone on the newest runtime.
          if pick is None:
              rt = rts[0]
              supported = rt.get("supportedDeviceTypes") or alltypes
              phones = [d for d in supported if d["name"].startswith("iPhone")]
              newest = max(phones, key=lambda d: (d.get("minRuntimeVersion", 0), alltypes.index(d) if d in alltypes else -1))
              pick = (rt, newest)
          rt, dt = pick
          print(rt["identifier"], dt["identifier"], dt["name"].replace(" ", "_"))
          PY
          )
          echo "Runtime: $RUNTIME"
          echo "Device type: $DEVTYPE ($DEVNAME)"
          if ! UDID=$(xcrun simctl create "DuoSketch-CI" "$DEVTYPE" "$RUNTIME"); then
            echo "::warning::Could not create $DEVNAME on $RUNTIME. Falling back to a standard iPhone."
            read -r DEVTYPE DEVNAME < <(xcrun simctl list -j runtimes | python3 -c '
          import json, sys
          rt = [r for r in json.load(sys.stdin)["runtimes"] if r["identifier"] == sys.argv[1]][0]
          ph = [d for d in rt["supportedDeviceTypes"] if d["name"].startswith("iPhone") and "Duo" not in d["name"]]
          p = max(ph, key=lambda d: d.get("minRuntimeVersion", 0))
          print(p["identifier"], p["name"].replace(" ", "_"))' "$RUNTIME")
            echo "Device type: $DEVTYPE ($DEVNAME)"
            UDID=$(xcrun simctl create "DuoSketch-CI" "$DEVTYPE" "$RUNTIME")
          fi
          echo "Created simulator $UDID"
          echo "::notice::Tests run on $DEVNAME, runtime $RUNTIME"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo "$DEVNAME" | tr '[:upper:]_ ' '[:lower:]--')" >> "$GITHUB_OUTPUT"

      - name: Build and test app
        working-directory: App
        run: |
          set -o pipefail
          xcodebuild -project DuoSketch.xcodeproj -scheme DuoSketch \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO build test

      - name: Export screenshots
        if: always()
        run: |
          if [ -d App/build/TestResults.xcresult ]; then
            scripts/export_screenshots.sh App/build/TestResults.xcresult "Screenshots/${{ steps.sim.outputs.slug }}"
          fi

      # App Store screenshots also need a 6.9 inch iPhone. Only on manual runs,
      # to keep pull request runs short.
      - name: Screenshots on a 6.9 inch iPhone
        if: github.event_name == 'workflow_dispatch'
        working-directory: App
        run: |
          set -o pipefail
          RUNTIME="${{ steps.sim.outputs.runtime }}"
          read -r DEVTYPE DEVNAME < <(xcrun simctl list -j runtimes | python3 -c '
          import json, sys
          rt = [r for r in json.load(sys.stdin)["runtimes"] if r["identifier"] == sys.argv[1]][0]
          big = [d for d in rt["supportedDeviceTypes"] if d["name"].startswith("iPhone") and d["name"].endswith("Pro Max")]
          if not big:
              raise SystemExit("::error::No Pro Max iPhone on " + sys.argv[1])
          p = max(big, key=lambda d: d.get("minRuntimeVersion", 0))
          print(p["identifier"], p["name"].replace(" ", "_"))' "$RUNTIME")
          UDID=$(xcrun simctl create "DuoSketch-69" "$DEVTYPE" "$RUNTIME")
          echo "::notice::6.9 inch screenshots on $DEVNAME"
          xcodebuild -project DuoSketch.xcodeproj -scheme DuoSketch \
            -destination "id=$UDID" \
            -only-testing:DuoSketchUITests/ScreenshotTests \
            -resultBundlePath build/Screenshots69.xcresult \
            CODE_SIGNING_ALLOWED=NO test
          ../scripts/export_screenshots.sh build/Screenshots69.xcresult \
            "../Screenshots/$(echo "$DEVNAME" | tr '[:upper:]_ ' '[:lower:]--')"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Screenshots
          path: Screenshots
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults
          path: App/build/TestResults.xcresult
          if-no-files-found: ignore
