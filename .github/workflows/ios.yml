name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: SketchCore and app (xcode-27 hosted runner)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: List Xcodes, SDKs and simulators
        run: |
          sw_vers
          echo "== Xcode installs"
          ls /Applications | grep Xcode || true
          echo "== Default Xcode"
          xcode-select -p
          xcodebuild -version
          echo "== SDKs"
          xcodebuild -showsdks
          echo "== Simulators"
          xcrun simctl list devices available

      - name: Select Xcode with iOS 27.1+ SDK
        run: |
          has_duo_sdk() {
            "$1/Contents/Developer/usr/bin/xcodebuild" -showsdks 2>/dev/null \
              | sed -nE 's/.*-sdk iphoneos([0-9.]+).*/\1/p' \
              | while read -r v; do
                  if [ "$(printf '%s\n27.1\n' "$v" | sort -V | head -1)" = "27.1" ]; then echo "$v"; fi
                done | sort -V | tail -1
          }
          PICK=""
          for x in $(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V -r); do
            v=$(has_duo_sdk "$x")
            if [ -n "$v" ]; then PICK="$x"; echo "$x has iOS SDK $v"; break; fi
            echo "$x: no iOS 27.1+ SDK"
          done
          if [ -z "$PICK" ]; then
            PICK=$(ls -d /Applications/Xcode_27.0*.app 2>/dev/null | sort -V | tail -1)
            echo "::warning::No Xcode with an iOS 27.1+ SDK found. Falling back to ${PICK:-the default Xcode}. DeviceHinge needs iOS 27.1."
          fi
          [ -n "$PICK" ] && sudo xcode-select -s "$PICK/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios
          swift --version
          echo "== Device types"
          xcrun simctl list devicetypes
          echo "== Runtimes"
          xcrun simctl list runtimes

      - name: SketchCore tests
        working-directory: Packages/SketchCore
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: App
        run: xcodegen generate

      - name: Create a simulator
        id: sim
        run: |
          read -r RUNTIME DEVTYPE DEVNAME < <(python3 - <<'PY'
          import json, subprocess
          def j(*a):
              return json.loads(subprocess.check_output(["xcrun", "simctl", "list", "-j", *a]))
          rts = [r for r in j("runtimes")["runtimes"]
                 if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-27")]
          rts.sort(key=lambda r: [int(x) for x in r["version"].split(".")])
          rt = rts[-1]
          supported = rt.get("supportedDeviceTypes") or j("devicetypes")["devicetypes"]
          phones = [d for d in supported if d["name"].startswith("iPhone")]
          duo = [d for d in phones if "Duo" in d["name"]]
          dt = (duo or phones)[-1]
          print(rt["identifier"], dt["identifier"], dt["name"].replace(" ", "_"))
          PY
          )
          echo "Runtime: $RUNTIME"
          echo "Device type: $DEVTYPE ($DEVNAME)"
          UDID=$(xcrun simctl create "DuoSketch-CI" "$DEVTYPE" "$RUNTIME")
          echo "Created simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test app
        working-directory: App
        run: |
          set -o pipefail
          xcodebuild -project DuoSketch.xcodeproj -scheme DuoSketch \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO build test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: App/build/TestResults.xcresult
          if-no-files-found: ignore
