name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: SketchCore and app (macOS 15, hosted)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: List Xcodes, SDKs and simulators
        run: |
          echo "== Xcode installs"
          ls /Applications | grep Xcode || true
          echo "== Default Xcode"
          xcode-select -p
          xcodebuild -version
          echo "== SDKs"
          xcodebuild -showsdks
          echo "== Simulators"
          xcrun simctl list devices available

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
          IOS_SDK=$(xcodebuild -showsdks | sed -nE 's/.*-sdk iphoneos([0-9.]+).*/\1/p' | sort -V | tail -1)
          echo "Newest iOS SDK: $IOS_SDK"
          if printf '%s\n27.1\n' "$IOS_SDK" | sort -V | head -1 | grep -qx '27.1'; then
            echo "iOS SDK $IOS_SDK includes the iPhone Duo hinge API (iOS 27.1+)."
          else
            echo "::warning::iOS SDK $IOS_SDK is older than 27.1, so the iPhone Duo hinge API (DeviceHinge, onHingeChange) is not available on this image."
          fi

      - name: SketchCore tests
        working-directory: Packages/SketchCore
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: App
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in data if "SimRuntime.iOS" in k),
                       key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[1].split("-")])
          picked = None
          for runtime in reversed(ios):
              phones = [d for d in data[runtime] if d["name"].startswith("iPhone")]
              duo = [d for d in phones if "Duo" in d["name"]]
              if duo or phones:
                  picked = (duo or phones)[-1]
                  print(picked["udid"], runtime, picked["name"], file=sys.stderr)
                  break
          print(picked["udid"] if picked else "")
          ')
          [ -n "$SIM" ] || { echo "No iPhone simulator available"; exit 1; }
          echo "udid=$SIM" >> "$GITHUB_OUTPUT"

      - name: Build and test app
        working-directory: App
        run: |
          set -o pipefail
          xcodebuild -project DuoSketch.xcodeproj -scheme DuoSketch \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO build test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: App/build/TestResults.xcresult
          if-no-files-found: ignore
